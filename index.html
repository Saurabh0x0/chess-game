<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saurabh Chess ♟️</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
  padding:20px;
}

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  width:90vw;
  max-width:420px;
  margin:20px auto;
  border:3px solid white;
}

.square{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  cursor:pointer;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.highlight{
  background:#7fbf7f !important;
}

button{
  padding:8px 18px;
  background:#222;
  color:white;
  border:1px solid white;
}
</style>
</head>

<body>

<h2>Saurabh Chess ♟️</h2>
<div id="board"></div>
<p id="status"></p>
<button onclick="resetGame()">Restart</button>

<script src="chess.min.js"></script>

<script>

const game = new Chess();
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let selectedSquare = null;

function renderBoard(){
  boardEl.innerHTML="";
  const board = game.board();

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){

      const squareName = String.fromCharCode(97+c)+(8-r);
      const squareDiv = document.createElement("div");

      squareDiv.classList.add("square");
      squareDiv.classList.add((r+c)%2==0?"light":"dark");
      squareDiv.dataset.square = squareName;

      const piece = board[r][c];
      if(piece){
        squareDiv.textContent = getSymbol(piece);
      }

      squareDiv.onclick = onSquareClick;
      boardEl.appendChild(squareDiv);
    }
  }

  updateStatus();
}

function getSymbol(piece){
  const map = {
    p:"♟", r:"♜", n:"♞", b:"♝", q:"♛", k:"♚"
  };

  let symbol = map[piece.type];

  if(piece.color==="w"){
    return symbol.replace("♟","♙")
                 .replace("♜","♖")
                 .replace("♞","♘")
                 .replace("♝","♗")
                 .replace("♛","♕")
                 .replace("♚","♔");
  }

  return symbol;
}

function clearHighlights(){
  document.querySelectorAll(".square")
    .forEach(s=>s.classList.remove("highlight"));
}

function onSquareClick(e){

  const square = e.target.dataset.square;

  if(selectedSquare){

    const move = game.move({
      from:selectedSquare,
      to:square,
      promotion:'q'
    });

    clearHighlights();
    selectedSquare=null;

    if(move){
      renderBoard();
    }

  } else {

    const moves = game.moves({
      square:square,
      verbose:true
    });

    if(moves.length>0){
      selectedSquare = square;

      moves.forEach(m=>{
        const target = document.querySelector(`[data-square="${m.to}"]`);
        if(target) target.classList.add("highlight");
      });
    }

  }
}

function updateStatus(){

  let status="";

  if(game.in_checkmate()){
    status = "Checkmate! " +
      (game.turn()==='w' ? "Black wins" : "White wins");
  }
  else if(game.in_draw()){
    status="Draw!";
  }
  else{
    status = (game.turn()==='w'?"White":"Black") + " to move";

    if(game.in_check()){
      status += " — Check!";
    }
  }

  statusEl.textContent = status;
}

function resetGame(){
  game.reset();
  selectedSquare=null;
  renderBoard();
}

renderBoard();

</script>

</body>
</html>
