<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saurabh Chess ♟️</title>

<style>
body {
  background: #111;
  color: white;
  text-align: center;
  font-family: Arial;
  padding: 20px;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: 90vw;
  max-width: 400px;
  margin: 20px auto;
  border: 3px solid white;
}

.square {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
}

.light { background: #f0d9b5; }
.dark { background: #b58863; }

button {
  padding: 10px 20px;
  background: #222;
  color: white;
  border: 1px solid white;
}
</style>
</head>

<body>

<h1>Saurabh Chess ♟️</h1>
<div id="board"></div>
<button onclick="resetBoard()">Restart</button>

<script>

const boardElement = document.getElementById("board");

const pieces = [
  "♜","♞","♝","♛","♚","♝","♞","♜",
  "♟","♟","♟","♟","♟","♟","♟","♟",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "","","","","","","","",
  "♙","♙","♙","♙","♙","♙","♙","♙",
  "♖","♘","♗","♕","♔","♗","♘","♖"
];

let selected = null;

function createBoard() {
  boardElement.innerHTML = "";
  for (let i = 0; i < 64; i++) {
    const square = document.createElement("div");
    square.classList.add("square");
    square.classList.add((Math.floor(i/8)+i)%2===0 ? "light" : "dark");
    square.dataset.index = i;
    square.textContent = pieces[i];
    square.addEventListener("click", onSquareClick);
    boardElement.appendChild(square);
  }
}

function onSquareClick(e) {
  const index = e.target.dataset.index;

  if (selected === null && pieces[index] !== "") {
    selected = index;
    e.target.style.outline = "3px solid red";
  } else if (selected !== null) {
    pieces[index] = pieces[selected];
    pieces[selected] = "";
    selected = null;
    createBoard();
  }
}

function resetBoard() {
  location.reload();
}

createBoard();

</script>

</body>
</html>
