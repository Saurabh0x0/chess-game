<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saurabh Chess ♟️</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

h2{ margin-top:20px; }

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  width:90vw;
  max-width:420px;
  margin:20px auto;
  border:3px solid white;
}

.square{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  cursor:pointer;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}
.highlight{background:#7fbf7f !important;}

button{
  padding:8px 20px;
  background:#222;
  color:white;
  border:1px solid white;
}

#status{
  margin:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>Saurabh Chess ♟️</h2>
<div id="status"></div>
<div id="board"></div>
<button onclick="resetGame()">Restart</button>

<script type="module">

import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/esm/chess.js";

const game = new Chess();
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let selected = null;

const symbols = {
  p:"♟", r:"♜", n:"♞", b:"♝", q:"♛", k:"♚"
};

function getSymbol(piece){
  let s = symbols[piece.type];
  if(piece.color === "w"){
    return s.replace("♟","♙")
            .replace("♜","♖")
            .replace("♞","♘")
            .replace("♝","♗")
            .replace("♛","♕")
            .replace("♚","♔");
  }
  return s;
}

function render(){
  boardEl.innerHTML="";
  const board = game.board();

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const square = document.createElement("div");
      square.className="square "+((r+c)%2==0?"light":"dark");
      square.dataset.square = String.fromCharCode(97+c)+(8-r);

      if(board[r][c]){
        square.textContent = getSymbol(board[r][c]);
      }

      square.onclick = clickSquare;
      boardEl.appendChild(square);
    }
  }

  updateStatus();
}

function clickSquare(e){
  const square = e.target.dataset.square;

  if(selected){
    const move = game.move({
      from:selected,
      to:square,
      promotion:'q'
    });

    clearHighlights();
    selected = null;

    if(move) render();

  } else {
    const moves = game.moves({square:square, verbose:true});
    if(moves.length){
      selected = square;
      moves.forEach(m=>{
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if(el) el.classList.add("highlight");
      });
    }
  }
}

function clearHighlights(){
  document.querySelectorAll(".square")
    .forEach(s=>s.classList.remove("highlight"));
}

function updateStatus(){
  let status="";
  if(game.isCheckmate()){
    status = "Checkmate! " +
      (game.turn()==="w" ? "Black wins" : "White wins");
  }
  else if(game.isDraw()){
    status="Draw!";
  }
  else{
    status = (game.turn()==="w"?"White":"Black")+" to move";
    if(game.isCheck()) status+=" — Check!";
  }
  statusEl.textContent=status;
}

window.resetGame = function(){
  game.reset();
  selected=null;
  render();
};

render();

</script>

</body>
</html>
