<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saurabh Chess ♟️</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

h2{
  margin-top:20px;
}

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  width:90vw;
  max-width:420px;
  margin:20px auto;
  border:3px solid white;
}

.square{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  cursor:pointer;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.selected{
  outline:3px solid #00ff88;
}

.highlight{
  background:#7fbf7f !important;
}

button{
  padding:8px 20px;
  background:#222;
  color:white;
  border:1px solid white;
}

#status{
  margin:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>Saurabh Chess ♟️</h2>

<div id="status"></div>
<div id="board"></div>
<button onclick="resetGame()">Restart</button>

<script>

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let board = [];
let selected = null;
let turn = "white";

const pieces = {
  r:"♜", n:"♞", b:"♝", q:"♛", k:"♚", p:"♟",
  R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔", P:"♙"
};

function initBoard(){
  board = [
    ["r","n","b","q","k","b","n","r"],
    ["p","p","p","p","p","p","p","p"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["P","P","P","P","P","P","P","P"],
    ["R","N","B","Q","K","B","N","R"]
  ];
  turn="white";
  selected=null;
  render();
}

function render(){
  boardEl.innerHTML="";
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const sq = document.createElement("div");
      sq.className="square "+((r+c)%2==0?"light":"dark");
      sq.dataset.row=r;
      sq.dataset.col=c;
      if(board[r][c]) sq.textContent=pieces[board[r][c]];
      sq.onclick=clickSquare;
      boardEl.appendChild(sq);
    }
  }
  statusEl.textContent = turn.charAt(0).toUpperCase()+turn.slice(1)+" to move";
}

function clickSquare(e){
  const r = e.target.dataset.row;
  const c = e.target.dataset.col;

  if(selected){
    board[r][c] = board[selected.r][selected.c];
    board[selected.r][selected.c]="";
    selected=null;
    turn = turn==="white"?"black":"white";
    render();
  } else {
    if(board[r][c]){
      const piece = board[r][c];
      if(turn==="white" && piece===piece.toUpperCase() ||
         turn==="black" && piece===piece.toLowerCase()){
        selected={r,c};
      }
    }
  }
}

function resetGame(){
  initBoard();
}

initBoard();

</script>

</body>
</html>
