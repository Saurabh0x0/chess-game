<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Saurabh Chess ♟️</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
  padding:20px;
}

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  width:90vw;
  max-width:420px;
  margin:20px auto;
  border:3px solid white;
}

.square{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  cursor:pointer;
}

.light{background:#f0d9b5;}
.dark{background:#b58863;}

.highlight{
  background:#7fbf7f !important;
}

button{
  padding:8px 18px;
  background:#222;
  color:white;
  border:1px solid white;
}
</style>
</head>
<body>

<h2>Saurabh Chess ♟️</h2>
<div id="board"></div>
<button onclick="init()">Restart</button>

<script>

const boardEl = document.getElementById("board");

let selected=null;
let turn="w";

let board=[
["r","n","b","q","k","b","n","r"],
["p","p","p","p","p","p","p","p"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["P","P","P","P","P","P","P","P"],
["R","N","B","Q","K","B","N","R"]
];

function symbol(p){
const map={
"p":"♟","r":"♜","n":"♞","b":"♝","q":"♛","k":"♚",
"P":"♙","R":"♖","N":"♘","B":"♗","Q":"♕","K":"♔"
};
return map[p]||"";
}

function render(){
boardEl.innerHTML="";
for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
let sq=document.createElement("div");
sq.className="square "+((r+c)%2==0?"light":"dark");
sq.dataset.r=r;
sq.dataset.c=c;
sq.textContent=symbol(board[r][c]);
sq.onclick=clickSquare;
boardEl.appendChild(sq);
}
}
}

function clearHighlight(){
document.querySelectorAll(".square").forEach(s=>s.classList.remove("highlight"));
}

function clickSquare(e){
let r=e.target.dataset.r;
let c=e.target.dataset.c;
let piece=board[r][c];

if(selected){
let [sr,sc]=selected;
board[r][c]=board[sr][sc];
board[sr][sc]="";
selected=null;
turn=turn==="w"?"b":"w";
clearHighlight();
render();
return;
}

if(piece!=="" && ((turn==="w" && piece===piece.toUpperCase())||(turn==="b" && piece===piece.toLowerCase()))){
selected=[r,c];
e.target.classList.add("highlight");
}
}

function init(){
turn="w";
board=[
["r","n","b","q","k","b","n","r"],
["p","p","p","p","p","p","p","p"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["P","P","P","P","P","P","P","P"],
["R","N","B","Q","K","B","N","R"]
];
render();
}

init();

</script>

</body>
</html>
